name: cargo_uchet
description: "Учёт клиентов, заказов, оплат и расходов с месячными отчётами."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  sqflite: ^2.4.0
  path: ^1.9.0
  path_provider: ^2.1.5
  share_plus: ">=11.0.0 <14.0.0"
  file_picker: ">=12.0.0 <14.0.0"
  excel: ">=4.0.6 <6.0.0"
  pdf: ^3.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
