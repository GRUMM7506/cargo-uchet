name: cargo_uchet
description: "Учёт должников: клиенты, заказы, залоги, оплаты и расходы."
publish_to: 'none'
version: 2.3.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  sqflite: ^2.4.0
  path: ^1.9.0
  path_provider: ^2.1.5
  share_plus: ">=11.0.0 <14.0.0"
  file_picker: ">=12.0.0 <14.0.0"
  excel: ">=4.0.6 <6.0.0"
  pdf: ^3.11.0
  image_picker: ^1.1.2
  archive: '>=3.6.0 <5.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/images/
  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
        - asset: assets/fonts/NotoSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700
