name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

env:
  ANDROID_USER_HOME: /home/runner/.android

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: |
          flutter --version | tee -a ci.log
          if [ ! -d android ]; then
            flutter create . --platforms=android --org com.akbar --project-name cargo_uchet 2>&1 | tee -a ci.log
          fi
          # Название приложения на рабочем столе (по языку телефона)
          RES=android/app/src/main/res
          mkdir -p $RES/values $RES/values-uz
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources><string name="app_name">Учёт</string></resources>\n' > $RES/values/strings.xml
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources><string name="app_name">Hisob-kitob</string></resources>\n' > $RES/values-uz/strings.xml
          sed -i 's/android:label="[^"]*"/android:label="@string\/app_name"/' android/app/src/main/AndroidManifest.xml
          grep -n 'android:label' android/app/src/main/AndroidManifest.xml | tee -a ci.log

      - name: Stable signing key (so updates install over the old version)
        run: |
          mkdir -p "$ANDROID_USER_HOME"
          cp ci/debug.keystore "$ANDROID_USER_HOME/debug.keystore"

      - name: Dependencies
        run: flutter pub get 2>&1 | tee -a ci.log

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee -a ci.log || true

      - name: Tests
        run: flutter test 2>&1 | tee -a ci.log

      - name: Build APK
        run: |
          flutter build apk --release --split-per-abi --build-number=${{ github.run_number }} 2>&1 | tee -a ci.log
          mkdir -p out
          N=${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk out/uchet-$N.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk out/uchet-$N-old-phones.apk
          ls -la out | tee -a ci.log
          APKSIGNER=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)apksigner
          "$APKSIGNER" verify --print-certs out/uchet-$N.apk 2>&1 | grep -i "SHA-256" | tee -a ci.log || true

      - uses: actions/upload-artifact@v4
        with:
          name: uchet-apk-${{ github.run_number }}
          path: out/*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Сборка ${{ github.run_number }}
          body: |
            **uchet-N.apk** — для обычных телефонов (ставить его).
            **uchet-N-old-phones.apk** — только если первый не устанавливается (старые 32-битные телефоны).
            Новая сборка ставится поверх старой, данные сохраняются.
          files: out/*.apk

      - name: Save build log to ci-logs branch
        if: always()
        run: |
          echo "result: ${{ job.status }} run ${{ github.run_number }} sha ${{ github.sha }}" >> ci.log
          cp ci.log /tmp/ci.log
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git checkout --orphan ci-logs-tmp
          git rm -rf --cached . -q
          git clean -fdxq -e out
          cp /tmp/ci.log ci.log
          git add ci.log
          git commit -qm "log run ${{ github.run_number }}"
          git push -qf origin HEAD:ci-logs
